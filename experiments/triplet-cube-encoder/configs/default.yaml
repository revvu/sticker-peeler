model:
  latent_dim: 128
  sticker_embed_dim: 16
  hidden_dim: 256

training:
  batch_size: 256
  epochs: 100
  learning_rate: 0.0003
  weight_decay: 0.0001
  margin: 0.2
  early_stop_metric: triplet_accuracy
  early_stop_mode: max
  early_stop_patience: 15
  train_split: 0.85
  state_disjoint_split: true
  grad_clip_norm: 1.0
  lr_schedule: cosine
  seed: 42

logging:
  tensorboard:
    enabled: true
    log_dir: runs/cube-triplet
    log_every_steps: 10
  wandb:
    enabled: false
    project: sticker-peeler-triplet

paths:
  dataset: data/triplets.jsonl
  checkpoints: checkpoints
