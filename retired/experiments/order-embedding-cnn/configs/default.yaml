model:
  latent_dim: 128
  sticker_embed_dim: 16
  conv_channels: 64
  hidden_dim: 256

training:
  device: mps
  batch_size: 256
  num_workers: 0
  epochs: 200
  learning_rate: 0.0003
  weight_decay: 0.0001
  anchor_weight: 1.0
  calibration_weight: 0.5
  huber_delta: 1.0
  order_violation_eps: 1.0e-4
  solved_anchor_subsample: 200000
  early_stop_metric: greedy_step_acc
  early_stop_mode: max
  early_stop_patience: 25
  train_split: 0.9
  grad_clip_norm: 1.0
  lr_schedule: cosine
  seed: 42

logging:
  tensorboard:
    enabled: true
    log_dir: runs/order-embedding-cnn
    log_every_steps: 10

paths:
  states_dataset: data/states.jsonl
  order_pairs_dataset: data/order_pairs.jsonl
  ranking_triplets_dataset: data/ranking_triplets.jsonl
  extrapolation_dataset: data/extrapolation.jsonl
  checkpoints: checkpoints
