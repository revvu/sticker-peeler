<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="data:,">
  <title>Rubik's Cube Emulator</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      overflow: hidden;
      background: #151719;
      color: #f5f7fa;
    }

    canvas {
      display: block;
    }

    .hud {
      position: fixed;
      left: 16px;
      top: 16px;
      max-width: min(360px, calc(100vw - 32px));
      padding: 12px 14px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 8px;
      background: rgba(20, 22, 25, 0.76);
      box-shadow: 0 14px 32px rgba(0, 0, 0, 0.32);
      backdrop-filter: blur(10px);
      user-select: none;
      pointer-events: none;
    }

    .hud h1 {
      margin: 0 0 8px;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0;
    }

    .hud p {
      margin: 0;
      color: #cbd5e1;
      font-size: 12px;
      line-height: 1.55;
    }

    .jepa-similarity {
      margin-top: 8px !important;
      color: #94a3b8;
      font-size: 11px;
    }

    .jepa-similarity strong {
      color: #e2e8f0;
      font: 600 11px/1.45 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    .console-panel {
      position: fixed;
      left: 16px;
      bottom: 166px;
      z-index: 2;
      width: min(336px, calc(100vw - 32px));
      height: 220px;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      gap: 8px;
      min-width: 0;
      padding: 12px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 8px;
      background: rgba(20, 22, 25, 0.78);
      box-shadow: 0 14px 32px rgba(0, 0, 0, 0.32);
      backdrop-filter: blur(10px);
    }

    .console-panel h2 {
      margin: 0;
      color: #f8fafc;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0;
      text-transform: uppercase;
    }

    .console-stream {
      min-height: 0;
      height: 100%;
      margin: 0;
      padding: 8px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      border: 1px solid rgba(148, 163, 184, 0.18);
      border-radius: 7px;
      background: rgba(15, 23, 42, 0.58);
      overflow-y: auto;
      overscroll-behavior: contain;
      scrollbar-gutter: stable;
      list-style: none;
    }

    .console-stream.is-overflowing {
      justify-content: flex-start;
    }

    .console-stream:empty::before {
      content: "Solver output will appear here.";
      color: #94a3b8;
      font: 500 13px/1.45 Inter, ui-sans-serif, system-ui, sans-serif;
    }

    .console-message {
      display: grid;
      flex: 0 0 auto;
      gap: 3px;
      margin: 0 0 8px;
      padding: 0;
    }

    .console-message:last-child {
      margin-bottom: 0;
    }

    .console-message time {
      color: #8fb5ff;
      font: 700 10px/1 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    .console-message span {
      color: #e5edf8;
      font: 650 12px/1.45 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      overflow-wrap: anywhere;
    }

    .control-panel {
      position: fixed;
      left: 50%;
      bottom: 18px;
      z-index: 3;
      width: min(760px, calc(100vw - 32px));
      transform: translateX(-50%);
      display: grid;
      gap: 10px;
      padding: 12px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 8px;
      background: rgba(20, 22, 25, 0.78);
      box-shadow: 0 14px 32px rgba(0, 0, 0, 0.32);
      backdrop-filter: blur(10px);
    }

    .control-toolbar {
      display: grid;
      grid-template-columns: auto minmax(180px, 1fr) auto;
      gap: 10px;
      align-items: center;
    }

    .control-panel button,
    .control-panel select {
      min-height: 38px;
      border-radius: 6px;
      font: 700 13px/1 Inter, ui-sans-serif, system-ui, sans-serif;
    }

    .control-panel button {
      padding: 0 14px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: #f5f7fa;
      color: #151719;
      cursor: pointer;
    }

    .control-panel button:disabled {
      cursor: not-allowed;
      opacity: 0.44;
    }

    .control-panel select {
      width: 100%;
      padding: 0 34px 0 11px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      background: rgba(255, 255, 255, 0.09);
      color: #f8fafc;
      cursor: pointer;
    }

    .control-panel select:disabled {
      cursor: wait;
      opacity: 0.62;
    }

    .scramble-sequence {
      min-width: 0;
      color: #e2e8f0;
      font: 700 14px/1.45 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      overflow-wrap: anywhere;
    }

    .scramble-sequence:empty::before {
      content: "Scramble sequence will appear here.";
      color: #94a3b8;
      font: 500 13px/1.45 Inter, ui-sans-serif, system-ui, sans-serif;
    }

    .solver-step-log {
      min-height: 24px;
      max-height: 132px;
      margin: 0;
      padding: 0 0 0 24px;
      overflow-y: auto;
      color: #dbeafe;
      font: 700 13px/1.55 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    .solver-step-log:empty {
      padding-left: 0;
    }

    .solver-step-log:empty::before {
      content: "Solver steps will appear here.";
      color: #94a3b8;
      font: 500 13px/1.45 Inter, ui-sans-serif, system-ui, sans-serif;
    }

    .solver-step-log li {
      padding-left: 4px;
    }

    kbd {
      display: inline-flex;
      min-width: 22px;
      height: 20px;
      align-items: center;
      justify-content: center;
      margin: 0 2px;
      padding: 0 5px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.1);
      color: #ffffff;
      font: 700 11px/1 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    @media (max-width: 620px) {
      .hud {
        max-width: calc(100vw - 32px);
      }

      .console-panel {
        bottom: 252px;
        height: 148px;
      }

      .control-toolbar {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 620px) and (max-height: 700px) {
      .console-panel {
        bottom: 228px;
        height: 124px;
      }
    }
  </style>
</head>
<body>
  <div class="hud" aria-hidden="true">
    <h1>Rubik's Cube Emulator</h1>
    <p>
      Turn faces with <kbd>F</kbd><kbd>B</kbd><kbd>U</kbd><kbd>D</kbd><kbd>R</kbd><kbd>L</kbd>.
      Hold <kbd>Shift</kbd> for counterclockwise turns. Drag to orbit.
    </p>
    <p class="jepa-similarity" id="jepaSimilarity">(JEPA) Similarity to solved: —</p>
    <p class="jepa-similarity" id="tripletSimilarity">(Triplet Loss) Similarity to solved: —</p>
    <p class="jepa-similarity" id="distanceToSolved">(SDL) Distance to solved: —</p>
    <p class="jepa-similarity" id="orderDistanceToSolved">(OECNN) Distance to solved: —</p>
  </div>

  <section class="console-panel" aria-label="Solver console">
    <h2>Console</h2>
    <ol class="console-stream" id="solverConsole" aria-live="polite"></ol>
  </section>

  <div class="control-panel">
    <div class="control-toolbar">
      <button type="button" id="scrambleButton">Scramble</button>
      <select id="solverSelect" aria-label="Solver"></select>
      <button type="button" id="solverStepButton">Step</button>
    </div>
    <div class="scramble-sequence" id="scrambleSequence" aria-live="polite"></div>
    <ol class="solver-step-log" id="solverStepLog" aria-live="polite"></ol>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.184.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.184.0/examples/jsm/"
      }
    }
  </script>
  <script type="module" src="src/main.js"></script>
</body>
</html>
